# render.yaml - A Fonte da Verdade para o Deploy
services:
  # O serviço principal da sua API
  - type: web
    name: bacelar-api # O nome do seu serviço
    env: docker
    autoDeploy: true # Ativa o deploy automático a cada push para a branch principal

    # Aponta para a raiz do seu repositório onde está o Dockerfile
    rootDir: .

    # Comando que roda UMA VEZ durante o build, APÓS a instalação de dependências.
    # Lugar perfeito para as migrações.
    preDeployCommand: "alembic upgrade head"

    # Não precisamos mais de `dockerCommand` ou `startCommand` aqui
    # porque já definimos o `CMD` no formato exec no nosso Dockerfile.
    # O Render vai usar o CMD do Dockerfile por padrão.

    # Conecta este serviço ao seu grupo de variáveis de ambiente
    envVars:
      # Puxa as variáveis de ambiente diretamente do grupo que criaremos
      - fromGroup: bacelar-env
      # Variável específica do banco de dados (o Render conecta automaticamente)
      - key: DATABASE_URL
        fromDatabase:
          name: bacelar-postgres # Verifique o nome do seu serviço de banco de dados
          property: connectionString

  # Definição do serviço de Redis
  - type: redis
    name: bacelar-redis
    plan: free