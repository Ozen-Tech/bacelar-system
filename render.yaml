# render.yaml - Versão Final Unificada e Corrigida

services:
  # O serviço principal da sua API
  - type: web
    name: bacelar-api
    env: docker
    autoDeploy: true
    rootDir: .
    preDeployCommand: "alembic upgrade head"
    envVars:
      - fromGroup: bacelar-env
      - key: DATABASE_URL
        fromDatabase:
          name: bacelar-postgres # <--- Este nome DEVE BATER
          property: connectionString

  # A DEFINIÇÃO DO BANCO DE DADOS
  - type: postgres # <--- AQUI ESTÁ A CORREÇÃO (era "psql")
    name: bacelar-postgres # <--- com o nome definido aqui
    plan: free 
    
  # A DEFINIÇÃO DO REDIS
  - type: redis
    name: bacelar-redis
    plan: free
    ipAllowList: [] # Permite conexões internas